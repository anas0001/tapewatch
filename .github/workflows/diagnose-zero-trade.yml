name: Diagnose zero-trade drought

# One-off, READ-ONLY diagnostic for the 2026-09-20 investigation (nine trading
# sessions with no entries). Reuses the exact connection steps from deploy.yml
# (same secrets, same private network) but never writes to the host, the
# service, or the database:
#   - the DB session is opened with `readonly=True` (a real Postgres
#     READ ONLY transaction — any accidental write raises, it doesn't just get
#     discouraged by convention);
#   - the only SSH commands run are `systemctl status`, `journalctl` (both
#     inherently read-only) and the DB script above.
#
# `environment: production` is deliberate, not copy-paste: if VM_HOST/VM_USER/
# VM_SSH_KEY/DB_* are environment-scoped secrets (they are, per deploy.yml),
# this job needs the same environment to read them — which means the same
# manual-approval gate deploy.yml gets, so this cannot run unattended either.
#
# Delete this file once the drought is diagnosed. It is a scratch tool, not a
# permanent addition to the pipeline.

on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "How many days of history to pull from the DB"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
      SINCE_DAYS: ${{ github.event.inputs.since_days }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Join private network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAG }}
          args: --ssh

      - name: Verify the private network is connected
        run: |
          state="$(tailscale status --json 2>/dev/null | jq -r '.BackendState // empty')"
          if [ "${state}" != "Running" ]; then
            echo "::error::Not connected to the private network (backend state: ${state:-unknown})."
            exit 1
          fi
          echo "Private network connected."

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)" > /dev/null 2>&1
          if ! printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null 2>&1; then
            echo "::error::Could not load the deploy key."
            exit 1
          fi
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "${VM_HOST}" > /tmp/hostkey && [ -s /tmp/hostkey ]; then
              cat /tmp/hostkey >> ~/.ssh/known_hosts
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not reach the host on port 22 after 5 attempts."
          exit 1

      - name: Service status + recent journal (read-only)
        run: |
          ssh -T "${VM_USER}@${VM_HOST}" "SERVICE_NAME='${SERVICE_NAME}' bash -s" << 'EOF'
          set -euo pipefail
          echo "### systemctl status ###"
          systemctl status "${SERVICE_NAME}" --no-pager -l | head -20 || true
          echo
          echo "### Earliest retained journal line (retention boundary) ###"
          journalctl -u "${SERVICE_NAME}" --no-pager -o short-iso | head -1 || true
          echo
          echo "### Journal line count ###"
          journalctl -u "${SERVICE_NAME}" --no-pager | wc -l || true
          echo
          echo "### CRITICAL / ERROR / traceback / drought / rejected lines ###"
          journalctl -u "${SERVICE_NAME}" --no-pager -o short-iso \
            | grep -iE "CRITICAL|ERROR|Traceback|drought|orphan|phantom|Signal rejected" \
            | grep -v RECONCILIATION \
            | tail -100 || true
          echo
          echo "### Full funnel trace for DKDCA (a specific qualifying candidate) ###"
          journalctl -u "${SERVICE_NAME}" --no-pager -o short-iso \
            | grep -i "DKDCA" || echo "(no lines mention DKDCA at all)"
          echo
          echo "### ALL Pre-market scan/eval/dedupe lines, full retained window ###"
          journalctl -u "${SERVICE_NAME}" --no-pager -o short-iso \
            | grep -E "Pre-market (candidate|eval|dedupe|window)|premarket_scan failed|Pre-market candidate evaluation failed" \
            | tail -1500 || true
          echo
          echo "### Signal/Gate/funnel-shaped lines, last 400 ###"
          journalctl -u "${SERVICE_NAME}" --no-pager -o short-iso \
            | grep -E "Signal \[|Gate \[|Signal funnel|tradeable positive signal|No positive signals|Risk gate|eligible after filtering" \
            | tail -400 || true
          EOF

      # The diagnostic query script is a real repo file (scripts/diagnose_zero_trade.py),
      # not a heredoc — an indented heredoc is fatal to Python (see the note on
      # the DB_URL one-liner in deploy.yml's "Write .env" step; multi-line
      # Python cannot survive the leading whitespace a nested, indented
      # heredoc adds to every line). scp'd to /tmp (never DEPLOY_PATH) and
      # removed immediately after running, so nothing persists on the host.
      - name: Database diagnostics (read-only transaction)
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          DB_URL="$(python3 -c 'import os, urllib.parse as u; print("postgresql://%s:%s@%s:%s/%s" % (u.quote(os.environ["DB_USER"], safe=""), u.quote(os.environ["DB_PASSWORD"], safe=""), os.environ.get("DB_HOST") or "localhost", os.environ.get("DB_PORT") or "5432", os.environ["DB_NAME"]))')"
          echo "::add-mask::${DB_URL}"

          scp -q scripts/diagnose_zero_trade.py "${VM_USER}@${VM_HOST}:/tmp/diagnose_zero_trade.py"

          ssh -T "${VM_USER}@${VM_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DB_URL='${DB_URL}' SINCE_DAYS='${SINCE_DAYS:-15}' bash -s" << 'OUTER'
          set -euo pipefail
          trap 'rm -f /tmp/diagnose_zero_trade.py' EXIT
          DB_URL="${DB_URL}" SINCE_DAYS="${SINCE_DAYS}" "${DEPLOY_PATH}/.venv/bin/python3" /tmp/diagnose_zero_trade.py
          OUTER
